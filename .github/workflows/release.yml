# Publishes the GitHub release for the version in extension/manifest.json,
# when there isn't one yet: builds the zip from extension/ and uses
# release-notes/v<version>.md as the notes. Runs when the manifest or the
# release notes change on main (or by hand from the Actions tab).
name: Release

on:
  push:
    branches: [main]
    paths:
      - extension/manifest.json
      - release-notes/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' extension/manifest.json | head -n 1)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then echo "exists=yes" >> "$GITHUB_OUTPUT"; else echo "exists=no" >> "$GITHUB_OUTPUT"; fi

      - name: Build the zip
        if: steps.check.outputs.exists == 'no'
        run: sh scripts/package.sh

      - name: Create the release
        if: steps.check.outputs.exists == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${{ steps.v.outputs.tag }}.md"
          test -f "$notes" || { echo "Missing $notes"; exit 1; }
          gh release create "${{ steps.v.outputs.tag }}" dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "PokeSurvivor Plus ${{ steps.v.outputs.version }}" \
            --notes-file "$notes"
