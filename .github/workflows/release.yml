# Publishes a GitHub release when a version tag (v1.0.0, v1.1.0…) is pushed:
# builds the zip from extension/ and uses release-notes/<tag>.md as the notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' extension/manifest.json | head -n 1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME doesn't match manifest version $v"; exit 1; fi

      - name: Build the zip
        run: sh scripts/package.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "PokeSurvivor Plus ${GITHUB_REF_NAME#v}" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag
