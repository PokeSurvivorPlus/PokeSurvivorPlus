name: Feature request
description: Suggest an idea for PokeSurvivor Plus
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like PokeSurvivor Plus to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The problem it solves or the moment in the game where you'd use it.
  - type: markdown
    attributes:
      value: PokeSurvivor Plus only changes the interface and quality of life; it won't add anything that affects the leaderboard.
